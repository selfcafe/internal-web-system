name: stera daily sales import

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日(YYYY-MM-DD)。省略時は前日"
        required: false
  schedule:
    # 毎日06:00 JST(旧PCのタスクスケジューラと同じ時刻) = 21:00 UTC(前日)
    - cron: "0 21 * * *"

jobs:
  import:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # このランナー(セルフホスト)には既にPythonがインストール済みのため、
      # actions/setup-pythonは使わない(PowerShellのスクリプト実行ポリシーで
      # インストーラーがブロックされるため、2026-08-08判明)
      - name: Install dependencies
        run: python -m pip install --quiet playwright requests python-dotenv

      - name: Run stera import script
        env:
          STERA_EMAIL: ${{ secrets.STERA_EMAIL }}
          STERA_PASSWORD: ${{ secrets.STERA_PASSWORD }}
          GAS_URL: ${{ secrets.GAS_URL }}
          PYTHONUTF8: "1"
        run: |
          if ("${{ github.event.inputs.date }}" -ne "") {
            python scripts/import_stera_daily_sales.py --date "${{ github.event.inputs.date }}"
          } else {
            python scripts/import_stera_daily_sales.py
          }

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-failure-screenshot
          path: scripts/_downloads/login_failure.png
          if-no-files-found: ignore

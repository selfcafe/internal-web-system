name: stera daily sales import (test)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日(YYYY-MM-DD)。省略時は前日"
        required: false

jobs:
  import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install playwright requests python-dotenv

      - name: Run stera import script
        env:
          STERA_EMAIL: ${{ secrets.STERA_EMAIL }}
          STERA_PASSWORD: ${{ secrets.STERA_PASSWORD }}
          GAS_URL: ${{ secrets.GAS_URL }}
          PYTHONUTF8: "1"
        run: |
          if ("${{ github.event.inputs.date }}" -ne "") {
            python scripts/import_stera_daily_sales.py --date "${{ github.event.inputs.date }}"
          } else {
            python scripts/import_stera_daily_sales.py
          }

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-failure-screenshot
          path: scripts/_downloads/login_failure.png
          if-no-files-found: ignore

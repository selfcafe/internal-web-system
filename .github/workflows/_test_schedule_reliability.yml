name: TEST schedule reliability (temporary, delete after use)

# 使い捨てのテスト用ワークフロー。GitHub Actionsのschedule(cron)トリガーが
# 実際にどの程度時間通りに発火するかを実測するためだけに作成(2026-09-12)。
# 目的を終えたら削除すること。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  log-time:
    runs-on: ubuntu-latest
    steps:
      - name: Log scheduled vs actual time
        run: |
          echo "actual UTC time: $(date -u +'%Y-%m-%dT%H:%M:%S')"
          echo "trigger event: ${{ github.event_name }}"

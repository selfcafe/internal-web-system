<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者ポータル道場</title>
<style>
/* このダッシュボードの配色・角丸・影・フォントは、実際の管理者ポータル(index.html)の
   ものにできる限り合わせている（濃緑#22703d系・クリーム背景#f8f4e7・ゴールド#dfc35a/#b6952f
   のアクセント・Segoe UI/Meiryoフォント）。実サイトはライトモード固定・ダーク対応が
   無いため、この道場も同じくライトモード固定にしている（2026-08-29、ユーザー依頼）。
   ガイド役の「コーチ」層だけは、実サイトの既存アクセントであるゴールド（.sub-tab.active
   等で「選択中/アクティブ」を示す色として既に使われている）を流用し、model UIの緑と
   衝突しないようにしている。 */
:root{
  --paper:#F8F4E7; --paper-2:#EFE6C8; --ink:#333333; --ink-soft:#6b6b63; --line:#DDDDDD;
  --surface:#FFFFFF; --surface-2:#F5F3EC;
  --shadow:0 2px 8px rgba(34,112,61,.14), 0 1px 3px rgba(0,0,0,.06);
  --coach:#B6952F; --coach-soft:#FBF3D8; --coach-ink:#5C4A12; --coach-ring:#DFC35A;
  --product:#22703D; --product-deep:#163F22; --product-soft:#E4F0E7; --product-ink:#12401F;
  --danger:#DC2626; --danger-soft:#FEE2E2;
  --gold:#B6952F; --gold-soft:#F3E8CC;
  --scrim:rgba(20,20,20,.55);
  font-size:16px;
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Segoe UI','Meiryo',sans-serif;
}
.mono{ font-family:Consolas,'SF Mono',ui-monospace,monospace; }
h1,h2,h3{ text-wrap:balance; margin:0; }
button{ font-family:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid var(--coach-ring); outline-offset:2px; }

/* ---------- shell layout ---------- */
.shell{ display:grid; grid-template-columns:296px 1fr; min-height:100vh; }
@media (max-width:900px){ .shell{ grid-template-columns:1fr; } .rail{ order:2; } .stagewrap{ order:1; } }

.rail{
  background:var(--paper-2); border-right:1px solid var(--line);
  padding:22px 16px 90px; display:flex; flex-direction:column; gap:18px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
@media (max-width:900px){ .rail{ position:static; height:auto; border-right:none; border-top:1px solid var(--line); padding:14px 14px 20px; } }

.brand{ display:flex; align-items:center; gap:10px; padding:2px 4px 10px; border-bottom:1px solid var(--line); }
.brand-mark{
  width:38px; height:38px; border-radius:8px; background:linear-gradient(180deg,#dfc35a,#b6952f);
  display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0;
  box-shadow:var(--shadow);
}
.brand-text h1{ font-size:16px; font-weight:900; letter-spacing:.02em; }
.brand-text p{ margin:2px 0 0; font-size:11.5px; color:var(--ink-soft); font-weight:500; }

.rail-modules{ display:flex; flex-direction:column; gap:4px; }
.rail-part-hdr{
  font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-soft); padding:14px 10px 4px;
}
.rail-part-hdr:first-child{ padding-top:2px; }
.mod-btn{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  background:transparent; border:1px solid transparent; border-radius:8px; padding:9px 10px;
  color:var(--ink); transition:background .15s, border-color .15s;
}
.mod-btn:hover{ background:var(--surface); }
.mod-btn.active{ background:var(--surface); border-color:var(--line); box-shadow:var(--shadow); }
.mod-num{
  width:26px; height:26px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:"JetBrains Mono",monospace; font-size:11px; font-weight:600;
  background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);
}
.mod-btn.active .mod-num{ background:var(--coach); color:#fff; border-color:var(--coach); }
.mod-btn.done .mod-num{ background:var(--product); color:#fff; border-color:var(--product); }
.mod-btn.done .mod-num::before{ content:"✓"; }
.mod-title{ font-size:13.5px; font-weight:700; line-height:1.35; }
.mod-eyebrow{ font-size:10px; color:var(--ink-soft); font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.mod-progress{ margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-soft); flex-shrink:0; }

.rail-foot{ margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
.rail-btn{
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px;
  font-size:12.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:8px;
}
.rail-btn:hover{ border-color:var(--ink-soft); }

/* ---------- stage ---------- */
.stagewrap{ display:flex; flex-direction:column; min-height:100vh; }
.topbar{
  display:flex; align-items:center; gap:14px; padding:16px 26px; border-bottom:1px solid var(--line);
  background:var(--paper);
}
.topbar h2{ font-size:15px; font-weight:900; }
.topbar .sub{ font-size:12px; color:var(--ink-soft); font-weight:500; }
.pause-toggle{
  margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  border-radius:99px; padding:7px 14px 7px 7px; font-size:12px; font-weight:700; color:var(--ink-soft);
}
.pause-dot{ width:10px; height:10px; border-radius:50%; background:var(--product); transition:background .2s; }
.pause-toggle.paused .pause-dot{ background:var(--ink-soft); }
.pause-toggle.paused{ color:var(--coach-ink); background:var(--coach-soft); border-color:var(--coach); }

.stage-scroll{ flex:1; overflow:auto; padding:34px 34px 220px; position:relative; }
@media (max-width:640px){ .stage-scroll{ padding:20px 16px 220px; } }
.stage{ max-width:880px; margin:0 auto; }

/* generic info card / mock-portal shared bits */
.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:22px 24px; }
.lede{ font-size:14.5px; line-height:1.8; color:var(--ink-soft); max-width:64ch; }
.section-lede{ font-size:14px; line-height:1.75; color:var(--ink-soft); margin:10px 0 22px; max-width:60ch; }
.stage h3.stage-h{ font-size:20px; font-weight:900; margin-bottom:4px; }
.stage .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--coach); margin-bottom:6px; }

.tbl{ width:100%; border-collapse:collapse; font-size:13px; }
.tbl th,.tbl td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
.tbl th{ color:var(--ink-soft); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
.tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); }
.tbl-wrap .tbl{ background:transparent; }

.note{ border-radius:9px; padding:14px 16px; font-size:13px; line-height:1.7; margin:14px 0; }
.note-tip{ background:var(--product-soft); border:1px solid color-mix(in srgb, var(--product) 35%, transparent); }
.note-warn{ background:var(--danger-soft); border:1px solid color-mix(in srgb, var(--danger) 35%, transparent); }
.note b{ display:block; font-size:12px; margin-bottom:3px; }

/* ----- mock "real product" chrome (its own green identity) ----- */
.portal{ background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
/* 実サイトのヘッダーはカード状ではなく、クリーム背景に直接ロゴ・ボタン・タイトルが
   並ぶフラットな構造（ボタンごとに色が違う: 業務管理=緑実線／マニュアル=緑線／
   請求=グレー／ログアウト=濃グレー／メニュー・設定=濃緑）。2026-08-29、実サイトの
   レイアウトに合わせて.portal-hd(色付きバー)方式から作り直した。 */
.mock-header{ padding:2px 4px 0; }
.mock-header-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.mock-header-row.top{ justify-content:space-between; }
.mock-header-row h1{ font-size:21px; color:var(--product); font-weight:700; margin:0; }
.mock-logo{ height:24px; width:auto; display:block; }
.p-btn{
  background:var(--product); color:#fff; border:none; border-radius:8px;
  padding:9px 13px; font-size:12.5px; font-weight:700; white-space:nowrap;
}
.p-btn:hover{ filter:brightness(1.08); }
.p-btn.ghost{ background:transparent; color:var(--product); border:1px solid var(--product); }
.p-btn.gray{ background:#8a8f7e; }
.p-btn.graydark{ background:#6b7280; }
.p-btn.solid{ background:#1a5c30; font-size:15px; padding:9px 13px; }
.p-region-tabs{ display:flex; gap:4px; padding:8px 10px 0; flex-wrap:wrap; background:linear-gradient(180deg,#dfc35a,#b6952f); border-radius:9px 9px 0 0; }
.p-menu-wrap{ position:relative; }
.p-menu-dd{
  position:absolute; top:calc(100% + 8px); left:0; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); min-width:200px; z-index:5;
  padding:6px; display:none;
}
.p-menu-dd.open{ display:block; }
.p-menu-sec{ font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; padding:8px 10px 4px; }
.p-menu-item{ padding:8px 10px; border-radius:8px; font-size:13px; font-weight:600; }
.p-menu-item:hover{ background:var(--product-soft); }
.p-tabs{ display:flex; gap:4px; padding:8px 10px 0; flex-wrap:wrap; background:#163f22; }
.p-tab{
  background:rgba(255,255,255,.1); border:2px solid transparent; border-radius:6px 6px 0 0; padding:9px 13px; font-size:12.5px; font-weight:700;
  color:rgba(255,255,255,.8);
}
.p-tab.active{ background:#fff; color:var(--product); border:2px solid #dfc35a; border-bottom:2px solid #fff; }
.p-body{ padding:20px; }

.p-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:9px; background:var(--surface-2); margin-bottom:10px; }
.p-row .name{ font-weight:700; font-size:13.5px; flex:1; min-width:120px; }
.pill{ display:inline-flex; align-items:center; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:700; }
.pill-wait{ background:var(--coach-soft); color:var(--coach-ink); }
.pill-ok{ background:var(--product-soft); color:var(--product-ink); }
.pill-no{ background:var(--danger-soft); color:var(--danger); }

.p-field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.p-field label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); }
.p-field input[type=text],.p-field input[type=date],.p-select{
  border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; background:var(--surface);
  color:var(--ink);
}
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.seg button{ background:var(--surface); border:none; padding:6px 12px; font-size:12px; font-weight:700; color:var(--ink-soft); }
.seg button.on{ background:var(--product); color:#fff; }

.chk-grid{ display:flex; flex-direction:column; gap:2px; }
.chk-vendor{ margin-top:10px; }
.chk-vendor-hd{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:700; color:var(--product-ink); background:var(--product-soft); padding:5px 10px; border-radius:6px; margin-bottom:4px; }
.chk-item{ display:flex; align-items:center; gap:9px; padding:5px 10px; font-size:13px; }
.chk-item input{ width:16px; height:16px; accent-color:var(--product); }

.p-btn2{ background:var(--product); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; }
.p-btn2:hover{ background:var(--product-deep); }
.p-btn2:disabled{ opacity:.4; cursor:not-allowed; }
.p-btn2.ghost{ background:transparent; color:var(--product); border:1px solid var(--product); }
.p-btn2.danger{ background:var(--danger); }

.acc{ border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; background:var(--surface-2); }
.acc-hd{ display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:13px; font-weight:700; background:var(--surface); }
.acc-hd .care{ margin-left:auto; font-size:11px; color:var(--ink-soft); font-weight:600; }
.acc-body{ padding:4px 12px 10px; display:none; }
.acc.open .acc-body{ display:block; }
.acc.open .acc-chevron{ transform:rotate(90deg); }
.acc-chevron{ display:inline-block; transition:transform .15s; font-size:11px; color:var(--ink-soft); }

.toast-wrap{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast{
  background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:99px; font-size:13px; font-weight:700;
  box-shadow:var(--shadow); animation:toastin .25s ease-out;
}
:root:not([data-theme="light"]) .toast{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
:root[data-theme="dark"] .toast{ background:var(--surface); color:var(--ink); border:1px solid var(--line); }
@keyframes toastin{ from{ opacity:0; transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }

.modal-scrim{ position:fixed; inset:0; background:var(--scrim); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal{ background:var(--surface); border-radius:10px; max-width:420px; width:100%; padding:22px; box-shadow:var(--shadow); }
.modal h4{ font-size:15px; font-weight:900; margin-bottom:10px; }
.modal .modal-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

.flow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; font-weight:700; margin:16px 0; }
.flow .node{ background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
.flow .node.accent{ background:var(--coach-soft); border-color:var(--coach); color:var(--coach-ink); }
.flow .arrow{ color:var(--ink-soft); }

.fork{ display:flex; flex-direction:column; align-items:center; gap:8px; margin:18px 0; }
.fork .dnode{ background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:12.5px; font-weight:700; text-align:center; }
.fork .dnode.accent{ background:var(--coach-soft); border-color:var(--coach); color:var(--coach-ink); }
.fork .dnode.dest{ background:var(--product-soft); border-color:var(--product); color:var(--product-ink); }
.fork .sub{ display:block; font-size:10.5px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
.fork .stem{ width:1px; height:14px; background:var(--line); }
.fork-split{ display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
.fork-branch{ display:flex; flex-direction:column; align-items:center; gap:8px; }

.done-list{ display:flex; flex-direction:column; gap:8px; margin:18px 0; }
.done-row{ display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); font-size:13px; font-weight:700; }
.done-row .ck{ width:22px; height:22px; border-radius:50%; background:var(--product); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }

/* ---------- coach layer (spotlight + card) ---------- */
.spot-ring{
  position:fixed; z-index:70; border-radius:9px; pointer-events:none;
  box-shadow:0 0 0 4px var(--coach-ring), 0 0 0 9999px var(--scrim);
  transition:top .28s cubic-bezier(.3,.9,.4,1), left .28s cubic-bezier(.3,.9,.4,1), width .28s, height .28s, opacity .2s;
}
.spot-ring.hide{ opacity:0; }
.coach-card{
  position:fixed; z-index:75; left:50%; bottom:26px; transform:translateX(-50%);
  width:min(560px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--coach);
  border-radius:10px; box-shadow:var(--shadow); padding:16px 18px;
}
.coach-card .cc-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.coach-badge{ background:var(--coach); color:#fff; font-size:10.5px; font-weight:800; border-radius:99px; padding:3px 10px; letter-spacing:.03em; }
.coach-step{ font-size:11px; color:var(--ink-soft); font-weight:700; margin-left:auto; font-family:"JetBrains Mono",monospace; }
.coach-msg{ font-size:14px; line-height:1.65; font-weight:600; }
.coach-msg b{ color:var(--coach-ink); }
.coach-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:10px; }
.coach-hint{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
.coach-next{ background:var(--coach); color:#fff; border:none; border-radius:9px; padding:8px 16px; font-size:12.5px; font-weight:800; }
.coach-next:hover{ background:var(--coach-ring); }
.coach-skip{ background:transparent; color:var(--ink-soft); border:none; font-size:11.5px; font-weight:700; text-decoration:underline; }

.finish-hero{ text-align:center; padding:30px 10px 10px; }
.finish-hero .big{ font-size:40px; }
.finish-hero h3{ font-size:22px; font-weight:900; margin:10px 0 6px; }
</style>
</head>
<body>

<div class="shell">
  <nav class="rail" id="rail"></nav>
  <div class="stagewrap">
    <div class="topbar">
      <h2 id="topbar-title">管理者ポータル道場</h2>
      <button class="pause-toggle" id="pauseToggle" onclick="Trainer.togglePause()">
        <span class="pause-dot"></span><span id="pauseLabel">ガイド中</span>
      </button>
    </div>
    <div class="stage-scroll" id="stageScroll">
      <div class="stage" id="stage"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>
<div class="spot-ring hide" id="spotRing"></div>
<div class="coach-card" id="coachCard" style="display:none"></div>

<script>
/* ============================================================
   管理者ポータル道場 — ガイド付き練習用サンドボックス
   実際の管理者ポータルの操作を、模擬データで安全に練習できる。
   ============================================================ */

const STORE_SAMPLE = [
  {id:'shibuya', name:'渋谷神南'},
  {id:'sasashima', name:'ささしまライブ'},
  {id:'chikusa', name:'千種'},
  {id:'taikodori', name:'太閤通駅'},
  {id:'morioka_ekimae', name:'盛岡駅前'},
  {id:'morioka_odori', name:'盛岡大通'},
];
const VENDORS = [
  {key:'apex', label:'アペックス 100RS', items:['ブレンドコーヒー豆','紅茶（粉末）','ミルク']},
  {key:'toyo', label:'トーヨーベンディング', items:['緑茶','ほうじ茶']},
  {key:'sales', label:'販売品', items:['ポテトチップス','クッキー']},
  {key:'tokai_snack', label:'東海エリア限定お菓子', items:['ういろう風クッキー']},
];
const CS_CATEGORIES = [
  {key:'server', label:'サーバー・カウンター', items:['サーバーカウンター拭き上げ','ドリップトレイ洗浄']},
  {key:'floor', label:'客席・フロア', items:['テーブル','床モップがけ']},
  {key:'trash', label:'ゴミ・在庫', items:['ゴミ出し','在庫棚整頓']},
];

/* ---------------- persistence ---------------- */
const SAVE_KEY = 'admin_portal_dojo_progress_v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null') || {}; }catch(e){ return {}; }
}
function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      moduleIndex: T.moduleIndex, stepIndex: T.stepIndex, completed: [...T.completed],
    }));
  }catch(e){}
}

/* ---------------- small helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2200);
}
function openModal(html){
  const scrim = document.createElement('div');
  scrim.className = 'modal-scrim'; scrim.id = 'activeModal';
  scrim.innerHTML = `<div class="modal">${html}</div>`;
  scrim.addEventListener('click', e => { if (e.target === scrim) closeModal(); });
  document.body.appendChild(scrim);
}
function closeModal(){ document.getElementById('activeModal')?.remove(); }

/* ================= MODULE DEFINITIONS ================= */
/* 各モジュールは render(state) でステージ全体を描画し、
   実際にクリックできるウィジェットが act('id') を呼ぶ。
   ステップは expect:'id' が一致した時だけ次へ進む（一致しない
   クリックは実際の見た目の変化だけ起きてガイドは進まない）。 */

const M = []; // モジュール配列（あとで push）

/* ---------- ヘッダー（モジュール1で使う簡易ヘッダー） ----------

function vendorChecklist(prefix, excluded){
  return VENDORS.map(v => `
    <div class="chk-vendor">
      <div class="chk-vendor-hd"><span>${esc(v.label)}</span>
        <label style="display:flex;align-items:center;gap:5px;font-weight:600">
          <input type="checkbox" ${v.items.every(it=>!excluded.has(v.key+'|'+it))?'checked':''}
            onchange="Trainer.toggleVendorAll('${prefix}','${v.key}', this.checked)"> 全選択
        </label>
      </div>
      <div class="chk-grid">
        ${v.items.map(it => `
          <label class="chk-item"><input type="checkbox" ${excluded.has(v.key+'|'+it)?'':'checked'}
            onchange="Trainer.toggleVendorItem('${prefix}','${v.key}','${esc(it)}', this.checked)">${esc(it)}</label>`).join('')}
      </div>
    </div>`).join('');
}

/* ================= ENGINE ================= */
const T = { moduleIndex:0, stepIndex:0, completed:new Set(), paused:false };
Object.assign(T, loadProgress());
T.completed = new Set(T.completed || []);
if (typeof T.moduleIndex !== 'number') T.moduleIndex = 0;
if (typeof T.stepIndex !== 'number') T.stepIndex = 0;

function byId(id){ return M.find(m => m.id === id); }

const Trainer = {
  get mod(){ return M[T.moduleIndex]; },
  get step(){ return this.mod.steps[T.stepIndex]; },

  gotoModule(i){
    T.moduleIndex = i; T.stepIndex = 0;
    saveProgress(); this.renderAll();
  },
  act(id){
    const mod = this.mod;
    mod.onAct && mod.onAct(id, mod.state);
    this.rerenderStage();
    if (!T.paused && this.step && this.step.expect === id) this.advanceStep();
  },

  /* ---- module-specific widget callbacks (kept here so every inline
     handler can simply call Trainer.xxx regardless of which module
     rendered the widget) ---- */
  setOrderDate(id, v){ const r = byId('orders').state.rows.find(x=>x.id==id); r.orderDate = v; this.rerenderStage(); },
  setActualQty(id, v){ const r = byId('orders').state.rows.find(x=>x.id==id); r.actualQty = v; this.rerenderStage(); },

  setStoreQuery(v){ byId('products').state.storeQuery = v; this.rerenderStage(); },
  selectStore(v){ const s = byId('products').state; s.store = v; s.excluded = new Set(); this.act('select-store'); },
  toggleAddStore(id, checked){ const s = byId('products').state; checked ? s.addStores.add(id) : s.addStores.delete(id); this.rerenderStage(); },
  toggleVendorAll(prefix, vendorKey, checked){
    const s = byId('products').state;
    VENDORS.find(v=>v.key===vendorKey).items.forEach(it => { const k=vendorKey+'|'+it; checked?s.excluded.delete(k):s.excluded.add(k); });
    this.act('toggle-vendor-all');
  },
  toggleVendorItem(prefix, vendorKey, item, checked){
    const s = byId('products').state;
    const k = vendorKey+'|'+item;
    checked ? s.excluded.delete(k) : s.excluded.add(k);
    this.act('toggle-vendor-item');
  },

  selectCsStore(v){ byId('checksheet').state.store = v; this.act('select-cs-store'); },
  toggleCsItem(key, item, checked){
    const s = byId('checksheet').state; const k = key+'|'+item;
    checked ? s.excluded.delete(k) : s.excluded.add(k);
    this.act('toggle-cs-item');
  },
  toggleCsAll(key, checked){
    const s = byId('checksheet').state;
    CS_CATEGORIES.find(c=>c.key===key).items.forEach(it => { const k=key+'|'+it; checked?s.excluded.delete(k):s.excluded.add(k); });
    this.rerenderStage();
  },

  selectAttStore(v){ byId('attendance').state.store = v; this.act('select-att-store'); },
  setNewName(v){ byId('attendance').state.newName = v; this.rerenderStage(); },
  advanceStep(auto){
    const mod = this.mod;
    if (T.stepIndex < mod.steps.length - 1) {
      T.stepIndex++;
    } else {
      T.completed.add(mod.id);
      if (T.moduleIndex < M.length - 1) { T.moduleIndex++; T.stepIndex = 0; }
      else { T.completed.add('__finished__'); }
    }
    saveProgress();
    this.renderAll();
  },
  skipStep(){ this.advanceStep(); },
  togglePause(){
    T.paused = !T.paused;
    const btn = document.getElementById('pauseToggle');
    const label = document.getElementById('pauseLabel');
    btn.classList.toggle('paused', T.paused);
    label.textContent = T.paused ? '自由に操作中' : 'ガイド中';
    this.renderCoach();
  },
  resetAll(){
    T.moduleIndex = 0; T.stepIndex = 0; T.completed = new Set();
    M.forEach(m => { m.state = deepClone(m._initialState); });
    saveProgress(); this.renderAll();
  },
  rerenderStage(){
    const mod = this.mod;
    const finished = T.completed.has('__finished__') && mod.id==='todo';
    document.getElementById('stage').innerHTML = mod.render(mod.state, finished);
    this.positionSpotlight();
  },
  _renderRailModules(){
    const PART_LABELS = { ops:'操作説明', setup:'管理者が設定する項目' };
    let lastPart = null, partCounter = 0;
    return M.map((m,i) => {
      let header = '';
      if (m.part !== lastPart && PART_LABELS[m.part]) {
        header = `<div class="rail-part-hdr">${esc(PART_LABELS[m.part])}</div>`;
        partCounter = 0;
      }
      lastPart = m.part;
      const numLabel = PART_LABELS[m.part] ? String(++partCounter).padStart(2,'0') : '🏁';
      return `${header}
        <button class="mod-btn ${i===T.moduleIndex?'active':''} ${T.completed.has(m.id)?'done':''}" onclick="Trainer.gotoModule(${i})">
          <span class="mod-num">${numLabel}</span>
          <span style="display:flex;flex-direction:column">
            <span class="mod-eyebrow">${esc(m.eyebrow)}</span>
            <span class="mod-title">${esc(m.title)}</span>
          </span>
          ${i===T.moduleIndex ? `<span class="mod-progress">${T.stepIndex+1}/${m.steps.length}</span>` : ''}
        </button>`;
    }).join('');
  },
  renderRail(){
    const rail = document.getElementById('rail');
    rail.innerHTML = `
      <div class="brand">
        <div class="brand-mark">🥋</div>
        <div class="brand-text"><h1>管理者ポータル道場</h1><p>実際の操作を模擬データで練習</p></div>
      </div>
      <div class="rail-modules">${this._renderRailModules()}</div>
      <div class="rail-foot">
        <button class="rail-btn" onclick="Trainer.resetAll()">🔁 進捗をリセット</button>
      </div>`;
  },
  renderCoach(){
    const card = document.getElementById('coachCard');
    const mod = this.mod;
    const step = this.step;
    const finished = T.completed.has('__finished__') && mod.id==='todo';
    if (finished) { card.style.display='none'; this.hideSpotlight(); return; }
    if (T.paused) {
      card.style.display='block';
      card.innerHTML = `
        <div class="cc-top"><span class="coach-badge">自由に操作中</span></div>
        <div class="coach-msg">ガイドを一時停止しています。ここまで進んだ画面を自由に触って試してみてください。</div>
        <div class="coach-actions"><span class="coach-hint">好きなだけ試したら「ガイド中」に戻せます</span>
          <button class="coach-next" onclick="Trainer.togglePause()">ガイドを再開</button></div>`;
      this.hideSpotlight();
      return;
    }
    card.style.display='block';
    card.innerHTML = `
      <div class="cc-top"><span class="coach-badge">STEP ${T.stepIndex+1}</span><span class="coach-step">${mod.title}</span></div>
      <div class="coach-msg">${step.msg}</div>
      <div class="coach-actions">
        <span class="coach-hint">${step.expect ? 'ハイライトされた場所をクリックすると次へ進みます' : ''}</span>
        <span style="display:flex;gap:10px;align-items:center">
          ${step.expect ? `<button class="coach-skip" onclick="Trainer.skipStep()">スキップ</button>` : ''}
          ${!step.expect ? `<button class="coach-next" onclick="Trainer.advanceStep()">次へ</button>` : ''}
        </span>
      </div>`;
  },
  hideSpotlight(){ document.getElementById('spotRing').classList.add('hide'); },
  positionSpotlight(){
    const ring = document.getElementById('spotRing');
    const step = this.step;
    const finished = T.completed.has('__finished__') && this.mod.id==='todo';
    if (T.paused || finished || !step || !step.target) { this.hideSpotlight(); return; }
    const el = document.querySelector(step.target);
    if (!el) { this.hideSpotlight(); return; }
    const r = el.getBoundingClientRect();
    ring.classList.remove('hide');
    ring.style.top = (r.top - 6) + 'px';
    ring.style.left = (r.left - 6) + 'px';
    ring.style.width = (r.width + 12) + 'px';
    ring.style.height = (r.height + 12) + 'px';
  },
  renderAll(){
    this.renderRail();
    this.rerenderStage();
    this.renderCoach();
  },
};
// JSON round-tripping would silently turn Set fields into plain {} objects
// (module states use Set for excluded/addStores), so clone by hand instead.
function deepClone(v){
  if (v instanceof Set) return new Set(v);
  if (Array.isArray(v)) return v.map(deepClone);
  if (v && typeof v === 'object') { const out = {}; for (const k in v) out[k] = deepClone(v[k]); return out; }
  return v;
}
M.forEach(m => { m._initialState = deepClone(m.state); });

// keep spotlight aligned on resize/scroll
window.addEventListener('resize', () => Trainer.positionSpotlight());
document.getElementById('stageScroll').addEventListener('scroll', () => Trainer.positionSpotlight());

Trainer.renderAll();
</script>

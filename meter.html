<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>集計表 | セルフカフェ</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!--
  集計表（ドリンクマシンのメーター）の単独ページ。2026-10-18〜。中身は meter-core.js(ポータルと共通、2026-10-19〜ポータルにも組み込み済み)。
  あとで社内ポータル(index.html)のタブとして移す前提で、ポータルとは別に先に作っている(ユーザー方針)。
  - ログイン・通信はポータルと同じGAS・同じパスワード(login で通行証を受け取り、以降の通信に t を付ける)。
  - ドリンクマシンの表示は「金種(売価)ごとの累計杯数」。その日に読んだ累計を入れ、前回の記録との差で杯数、杯数×売価でメーター上の金額を出す。
    メーター上の金額はサブスク(オフィス決済)の分も含むので、実売上ではない(実売上の出し方は要検討、2026-10-18)。
  - 使う店と、店ごとの機械・金種は設定 meter_config = {店舗ID: {machines:[{label, prices:[520,...]}]}}。
    管理者がこのページの「使う店の設定」でチェックを入れて紐づける(チェックを外すと null)。
  - 記録はGASの meter_readings(getMeterReadings / saveMeterReading。同じ日は置き換え)。
-->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8f3e6; color:#1f2937; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; flex-wrap:wrap; }
  header img { height:34px; }
  header h1 { margin:0; font-size:22px; color:#22703d; }
  header .who { margin-left:auto; font-size:13px; color:#64748b; display:flex; gap:8px; align-items:center; }
  main { padding:0 16px 40px; max-width:1100px; margin:0 auto; }
</style>
</head>
<body>
<header>
  <img src="logo-horizontal.png" alt="セルフカフェ">
  <h1>集計表</h1>
  <div class="who" id="who"></div>
</header>
<main id="app"></main>

<script src="stores.js"></script>
<script src="meter-core.js"></script>
<script>
// 集計表の中身(計算・入力画面・月の表・使う店の設定)は meter-core.js。ポータル(index.html)と共通
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzoqu607sj-rpYulIiDwnuyGSCTzoblzSqaq37cb5k5KiGsK7sisZew9sSRSBoYBSwo_A/exec';
const AUTH_KEY = 'meter_auth';   // {token, role, stores, expiresAt}。このタブの中だけ(sessionStorage)
const esc = s => (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function auth() { try { const a = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); return a && a.expiresAt > Date.now() ? a : null; } catch (_) { return null; } }
function logout() { sessionStorage.removeItem(AUTH_KEY); settings = null; render(); }
function _authFail(res) {
  if (res && res.authError && res.authCode === 'token') { logout(); throw new Error('ログインし直してください'); }
  return res;
}
async function gasGet(action, params) {
  const q = new URLSearchParams({ action, ...(params || {}) });
  const a = auth(); if (a) q.set('t', a.token);
  return _authFail(await (await fetch(GAS_URL + '?' + q)).json());
}
async function gasPost(action, body) {
  const a = auth();
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, ...body, ...(a ? { t: a.token } : {}) }) });
  return _authFail(await res.json());
}

let settings = null;   // {key: value}
function allStores() {
  const names = Object.assign({}, typeof STORES === 'object' ? STORES : {});
  try { Object.entries(JSON.parse(settings.custom_stores || '{}')).forEach(([k, v]) => { names[k] = v && v.name ? v.name : k; }); } catch (_) {}
  try { JSON.parse(settings.deleted_stores || '[]').forEach(k => delete names[k]); } catch (_) {}
  return names;
}
MeterCore.init({
  get: gasGet, post: gasPost, names: allStores,
  configAll: () => { try { return JSON.parse(settings.meter_config || '{}') || {}; } catch (_) { return {}; } },
  onConfigSaved: all => { settings.meter_config = JSON.stringify(all); },
});

const app = () => document.getElementById('app');
async function render() {
  const a = auth(), who = document.getElementById('who');
  if (!a) { who.innerHTML = ''; renderLogin(); return; }
  if (!settings) {
    app().innerHTML = '<div style="color:#aaa;padding:20px">読み込み中…</div>';
    try {
      const rows = a.role === 'admin' ? await gasGet('getSettings') : await gasGet('getStoreSettings', { storeId: a.stores[0] });
      if (!Array.isArray(rows)) throw new Error((rows && rows.error) || '設定を読み込めませんでした');
      settings = Object.fromEntries(rows.map(r => [r.key, r.value]));
    } catch (e) { app().innerHTML = `<div style="color:#dc2626;padding:20px">${esc(e.message)}</div>`; return; }
  }
  const names = allStores();
  who.innerHTML = `${a.role === 'admin' ? '管理者' : esc(names[a.stores[0]] || a.stores[0]) + '店'}<button onclick="logout()" style="padding:6px 12px;border:1px solid #cbd5e1;border-radius:6px;background:white;cursor:pointer">ログアウト</button>`;
  if (a.role === 'admin') MeterCore.mountAdmin(app());
  else MeterCore.mountSheet(app(), a.stores[0]);
}

function renderLogin() {
  app().innerHTML = `<div style="background:white;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;max-width:420px;margin:40px auto">
    <div style="font-weight:700;margin-bottom:10px">ログイン</div>
    <div style="font-size:12px;color:#64748b;margin-bottom:10px">社内ポータルと同じパスワードです。</div>
    <form onsubmit="event.preventDefault();doLogin()">
      <input type="password" id="pw" autocomplete="current-password" placeholder="パスワード" style="width:100%;margin-bottom:10px;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px">
      <button id="login-btn" style="width:100%;padding:9px;border:none;border-radius:6px;background:#22703d;color:white;font-weight:700;font-size:15px;cursor:pointer">ログイン</button>
    </form>
    <div id="login-msg" style="margin-top:8px;color:#dc2626;font-size:13px"></div></div>`;
  document.getElementById('pw').focus();
}
async function doLogin() {
  const pw = document.getElementById('pw').value.trim();
  const btn = document.getElementById('login-btn'), msg = document.getElementById('login-msg');
  if (!pw) { msg.textContent = 'パスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = '確認中…';
  try {
    const res = await gasPost('login', { password: pw });
    if (!res || !res.ok) throw new Error((res && res.error) || 'ログインできませんでした');
    if (res.role !== 'admin' && res.role !== 'store') throw new Error('このページは店舗か管理者のパスワードでログインしてください');
    sessionStorage.setItem(AUTH_KEY, JSON.stringify({ token: res.token, role: res.role, stores: res.stores || [], expiresAt: res.expiresAt }));
    settings = null;
    render();
  } catch (e) { msg.textContent = e.message; btn.disabled = false; btn.textContent = 'ログイン'; }
}

render();
</script>
</body>
</html>
